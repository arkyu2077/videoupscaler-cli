[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videoupscaler"
dynamic = ["version"]
description = "Command-line client for the VideoUpscaler API: upscale videos to 1080p, 2K or 4K with AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "VideoUpscaler", email = "support@videoupscaler.co" }]
keywords = ["video", "upscale", "upscaler", "4k", "ai", "super-resolution", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://videoupscaler.co"
Documentation = "https://videoupscaler.co/docs"
Source = "https://github.com/arkyu2077/videoupscaler-cli"
Issues = "https://github.com/arkyu2077/videoupscaler-cli/issues"
Pricing = "https://videoupscaler.co/pricing"

[project.scripts]
videoupscaler = "videoupscaler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "videoupscaler.__version__" }
