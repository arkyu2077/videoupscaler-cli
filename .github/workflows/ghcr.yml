name: Publish Docker Image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Push ghcr.io/arkyu2077/videoupscaler-cli (GITHUB_TOKEN)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/arkyu2077/videoupscaler-cli:latest \
            -t ghcr.io/arkyu2077/videoupscaler-cli:0.1.0 \
            .
      - name: Push ghcr.io/arkyu2077/videoupscaler (GHCR_PAT or GITHUB_TOKEN)
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ghcr.io/arkyu2077/videoupscaler:latest \
            -t ghcr.io/arkyu2077/videoupscaler:0.1.0 \
            . || echo "::warning::ghcr.io/arkyu2077/videoupscaler is currently linked to arkyu2077/videoupscaler; pushed ghcr.io/arkyu2077/videoupscaler-cli successfully."
