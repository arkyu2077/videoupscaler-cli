name: Release

# Tag v<version> (matching pyproject/package.json) to publish to PyPI, npm and Docker Hub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cli

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          py=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/videoupscaler/__init__.py').read()).group(1))")
          npm=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="$npm"
          fi
          echo "tag=$tag python=$py npm=$npm"
          [ "$tag" = "$py" ] && [ "$tag" = "$npm" ] || { echo "tag $tag does not match versions ($py / $npm)"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  pypi:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Skip when this version is already on npm, so a re-run of the tag never fails here
      - run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${{ needs.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "$name@${{ needs.check.outputs.version }} is already published, skipping"
          elif [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
            npm install -g npm@latest && npm publish --provenance --access public || echo "npm publish skipped or requires OIDC configuration"
          else
            npm install -g npm@latest && npm publish --provenance --access public || echo "npm OIDC trusted publishing not configured yet, skipping"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
      - name: Update Docker Hub description
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: "AI video upscaler CLI for videoupscaler.co: upscale videos to 1080p, 2K or 4K"
          readme-filepath: ./README.md
          enable-url-completion: true
