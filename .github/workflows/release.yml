name: Release

# Tag v<version> (matching pyproject/package.json) to publish to PyPI, npm and Docker Hub.
on:
  push:
    tags: ["v*"]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cli

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/videoupscaler/__init__.py').read()).group(1))")
          npm=$(node -p "require('./package.json').version")
          echo "tag=$tag python=$py npm=$npm"
          [ "$tag" = "$py" ] && [ "$tag" = "$npm" ] || { echo "tag $tag does not match versions ($py / $npm)"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  pypi:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.check.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
      # Docker Hub repository description = README (keeps the videoupscaler.co links on the Hub page)
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: "AI video upscaler CLI for videoupscaler.co: upscale videos to 1080p, 2K or 4K"
          readme-filepath: ./README.md
